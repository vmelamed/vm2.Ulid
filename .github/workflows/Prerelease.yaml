name: Publish Prerelease NuGet Packages

# This workflow handles the publishing of NuGet pre-releases. It is triggered after the CI workflow completes successfully for
# pushes to the main branch and can also be manually triggered via the workflow_dispatch event.

on:
  workflow_run:
    branches:
      - main # trigger after CI completes for pushes to main (PR merges only, verified by pull_requests check)
    workflows:
      - "CI: Build, Test, Benchmark, Pack"
    types:
      - completed

  # we pre-release from main only, on completing "CI: Build, Test, Benchmark, Pack" in main (after merge) and on manual trigger
  workflow_dispatch:
    inputs:
      minver-prerelease-id:
        description: "Prerelease prefix (e.g. preview.0, alpha, beta, rc1, etc.)"
        type: string
        required: true
        default: preview.0

      reason:
        description: "Reason for manual pre-release (do not use: ; | & $ ` \\ < > ( ) { } new-line )"
        required: true
        type: string

env:
  PACKAGE_PROJECTS: >-
    [
    "src/Ulid/Ulid.csproj",
    "src/Serialization.NsJson.Ulid/Serialization.NsJson.Ulid.csproj",
    "src/UlidTool/UlidTool.csproj"
    ]
  NUGET_SERVER: ${{ vars.NUGET_SERVER || 'nuget' }}
  NUGET_USERNAME: ${{ vars.NUGET_USERNAME || 'vmelamed' }}
  PREPROCESSOR_SYMBOLS: ""
  MINVERTAGPREFIX: ${{ vars.MINVERTAGPREFIX || 'v' }}                           # The MinVer tag prefix.
  MINVERDEFAULTPRERELEASEIDENTIFIERS: ${{ vars.MINVERDEFAULTPRERELEASEIDENTIFIERS || 'preview.0' }} # The MinVer default pre-release identifiers.
  VERBOSE: ${{ vars.VERBOSE || false }}                                         # Set the variable to "true" to enable verbose logging in scripts.

jobs:
  get-params:
    name: Prepare the parameters
    runs-on: ubuntu-latest
    if: |
      ( github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main' )
      ||
      ( github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]') )
    outputs:
      target-framework: ${{ steps.gather-params.outputs.target-framework }}
      package-projects: ${{ steps.gather-params.outputs.package-projects }}
      preprocessor-symbols: ${{ steps.gather-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ steps.gather-params.outputs.minver-tag-prefix }}
      minver-prerelease-id: ${{ steps.gather-params.outputs.minver-prerelease-id }}
      reason: ${{ steps.gather-params.outputs.reason }}
      nuget-server: ${{ steps.gather-params.outputs.nuget-server }}
      nuget-username: ${{ steps.gather-params.outputs.nuget-username }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Setup the latest jq
        id: setup-jq
        uses: vmelamed/vm2.DevOps/.github/actions/setup-jq@main

      - name: Gather argument values depending on the event
        id: gather-params
        shell: bash
        env:
          MINVER_PRERELEASE_ID: ${{ inputs.minver-prerelease-id }}
          REASON: ${{ inputs.reason }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          package_projects='${{ env.PACKAGE_PROJECTS }}'
          validate_json_array package_projects '[]' is_safe_existing_file
          preprocessor_symbols='${{ env.PREPROCESSOR_SYMBOLS }}'
          minver_tag_prefix='${{ env.MINVERTAGPREFIX }}'
          minver_prerelease_id='${{ env.MINVERDEFAULTPRERELEASEIDENTIFIERS }}'
          nuget_server='${{ env.NUGET_SERVER }}'
          nuget_username='${{ env.NUGET_USERNAME }}'
          reason="Pre-release: PR approved, tagged with pre-release tag."

          if [[ '${{ github.event_name }}' == "workflow_dispatch" ]]; then
              # For UI manually triggered runs (workflow_dispatch event), use the arg. values from env: vars, secrets, defaults
              # and override with the inputs from the UI:

              minver_prerelease_id=$MINVER_PRERELEASE_ID
              reason=$REASON
          fi

          declare -a args=(
              --force
              --quiet
              --markdown
              --header "Job get-params outputs:"
              package_projects
              preprocessor_symbols
              minver_tag_prefix
              minver_prerelease_id
              reason
              nuget_server
              nuget_username
          )
          dump_vars "${args[@]}" | to_summary

          # Set the outputs:
          args=(
              package_projects
              preprocessor_symbols
              minver_tag_prefix
              minver_prerelease_id
              reason
              nuget_server
              nuget_username
          )
          args_to_github_output "${args[@]}"

  log-trigger:
    name: Log manual trigger reason
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log manual trigger reason
        run: |
          echo "::notice::Manual release triggered by ${{ github.actor }}"
          echo "::notice::Reason: ${{ inputs.reason }}"

  build-prerelease:
    name: Prerelease - package and release NuGet prerelease
    needs:
      - get-params
    uses: vmelamed/vm2.DevOps/.github/workflows/_prerelease.yaml@main
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}     # Required PAT for pushing changelog and tags past branch protection.
    permissions:
      actions: read # Required to checkout the code, push changelog, and create tags
      contents: write # Required to checkout the code, push changelog, and create tags
      packages: write # Required to add pre-release NuGet packages
      id-token: write # Required for authentication with the NuGet server
    with:
      package-projects: ${{ needs.get-params.outputs.package-projects }}
      preprocessor-symbols: ${{ needs.get-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ needs.get-params.outputs.minver-tag-prefix }}
      minver-prerelease-id: ${{ needs.get-params.outputs.minver-prerelease-id }}
      reason: ${{ needs.get-params.outputs.reason }}
      nuget-server: ${{ needs.get-params.outputs.nuget-server }}
      nuget-username: ${{ needs.get-params.outputs.nuget-username }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  publish-prerelease:
    name: Publish NuGet prerelease packages
    needs:
      - get-params
      - build-prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: read   # Required to read workflow run artifact IDs (for downloading package artifacts if the NuGet server is 'nuget')
      id-token: write # Required for authentication with the NuGet server
    steps:
      # This job never builds anything -- it only downloads .nupkg files another job already produced and pushes
      # them -- so "packages" here is just a local staging directory for this job's own runner, not the
      # Directory.Build.props-derived ArtifactsPath the rest of the pipeline uses for real build output.
      #
      # merge-multiple: true flattens all downloaded package artifacts into one directory -- without it, each
      # artifact-id lands in its own nested subfolder (packages/<artifact-name>/*.nupkg), one level deeper than
      # the flat packages/*.nupkg glob the publish step below expects.
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-prerelease.outputs.artifact-ids }}
          path: packages
          merge-multiple: true

      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Authenticate with NuGet.org trusted publishing to get steps.nuget-login.outputs.NUGET_API_KEY
        if: needs.get-params.outputs.nuget-server == 'nuget'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ needs.get-params.outputs.nuget-username }}

      - name: Publish NuGet prerelease packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ needs.get-params.outputs.nuget-server == 'nuget' && steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
          NUGET_SERVER: ${{ needs.get-params.outputs.nuget-server }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          set -euo pipefail

          declare -xri err_missing_argument
          declare -xri err_argument_value

          artifacts_dir="packages"
          case "$NUGET_SERVER" in
              nuget )
                  server_name="NuGet.org"
                  server_url="https://api.nuget.org/v3/index.json"
                  ;;

              github )
                  server_name="GitHub Packages"
                  server_url="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                  ;;

              http://*|https://* )
                  server_name="$NUGET_SERVER"
                  server_url="$NUGET_SERVER"
                  ;;

              * )
                  error -ec "$err_argument_value" -ns "Unsupported NuGet server: '${{ needs.get-params.outputs.nuget-server }}'. Supported values: 'nuget', 'github', 'custom URL'."
                  ;;
          esac

          [[ -n "$NUGET_API_KEY" ]] ||
              error -ec "$err_missing_argument" -ns "No API key provided for server '$server_name'"
          exit_if_has_errors

          for pkg in "$artifacts_dir"/*.nupkg; do
              trace "Publishing package: $pkg"
              dotnet nuget push "$pkg" \
                  --source "$server_url" \
                  --api-key "$NUGET_API_KEY" \
                  --skip-duplicate
          done

  remind-changelog:
    name: Reminder - review CHANGELOG.md
    runs-on: ubuntu-latest
    needs:
      - publish-prerelease
    steps:
      - name: Post reminder
        shell: bash
        run: |
          echo "::notice::Pre-release completed. Now is a good time to review/edit CHANGELOG.md before stable release. CHANGELOG.md only - do not mix-in other files."
          {
            echo "## CHANGELOG Reminder"
            echo
            echo "> [!IMPORTANT]"
            echo "> Pre-release completed. Now is a good time to review/edit CHANGELOG.md before stable release."
            echo "> CHANGELOG.md only - do not mix-in other files."
            echo
            echo "Recommended: keep changelog updates in a dedicated commit or PR before the release workflow."
          } >> "$GITHUB_STEP_SUMMARY"
