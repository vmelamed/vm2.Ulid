name: Publish Prerelease NuGet Packages

# This workflow handles the publishing of NuGet pre-releases. It is triggered after the CI workflow completes successfully for
# pushes to the main branch and can also be manually triggered via the workflow_dispatch event.

on:
  workflow_run:
    branches:
      - main # trigger after CI completes for pushes to main (PR merges only, verified by pull_requests check)
    workflows:
      - "CI: Build, Test, Benchmark, Pack"
    types:
      - completed

  # we pre-release from main only, on completing "CI: Build, Test, Benchmark, Pack" in main (after merge) and on manual trigger
  workflow_dispatch:
    inputs:
      minver-prerelease-id:
        description: "Prerelease prefix (e.g. preview.0, alpha, beta, rc1, etc.)"
        type: string
        required: true
        default: preview.0

      reason:
        description: "Reason for manual pre-release (do not use: ; | & $ ` \\ < > ( ) { } new-line )"
        required: true
        type: string

env:
  PACKAGE_PROJECTS: >-
    [
    "src/Ulid/Ulid.csproj",
    "src/Serialization.NsJson.Ulid/Serialization.NsJson.Ulid.csproj",
    "src/UlidTool/UlidTool.csproj"
    ]
  NUGET_SERVER: ${{ vars.NUGET_SERVER || 'nuget' }}
  NUGET_USERNAME: ${{ vars.NUGET_USERNAME || 'vmelamed' }}
  PREPROCESSOR_SYMBOLS: ""
  MINVERTAGPREFIX: ${{ vars.MINVERTAGPREFIX || 'v' }}                           # The MinVer tag prefix.
  MINVERDEFAULTPRERELEASEIDENTIFIERS: ${{ vars.MINVERDEFAULTPRERELEASEIDENTIFIERS || 'preview.0' }} # The MinVer default pre-release identifiers.
  VERBOSE: ${{ vars.VERBOSE || false }}                                         # Set the variable to "true" to enable verbose logging in scripts.

jobs:
  get-params:
    name: Prepare the parameters
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for the NuGet.org trusted-publishing OIDC exchange below
    if: |
      ( github.event_name == 'workflow_dispatch' &&
        ( github.ref_name == 'main' || github.ref_name == 'big-bang' ) )
      ||
      ( github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]') )
    outputs:
      package-projects: ${{ steps.gather-params.outputs.package-projects }}
      preprocessor-symbols: ${{ steps.gather-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ steps.gather-params.outputs.minver-tag-prefix }}
      minver-prerelease-id: ${{ steps.gather-params.outputs.minver-prerelease-id }}
      reason: ${{ steps.gather-params.outputs.reason }}
      nuget-server: ${{ steps.gather-params.outputs.nuget-server }}
      nuget-api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@big-bang

      - name: Setup the latest jq
        id: setup-jq
        uses: vmelamed/vm2.DevOps/.github/actions/setup-jq@big-bang

      - name: Gather argument values depending on the event
        id: gather-params
        shell: bash
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          package_projects='${{ env.PACKAGE_PROJECTS }}'
          validate_json_array package_projects '[]' is_safe_existing_file
          preprocessor_symbols='${{ env.PREPROCESSOR_SYMBOLS }}'
          minver_tag_prefix='${{ env.MINVERTAGPREFIX }}'
          minver_prerelease_id='${{ env.MINVERDEFAULTPRERELEASEIDENTIFIERS }}'
          nuget_server='${{ env.NUGET_SERVER }}'
          nuget_username='${{ env.NUGET_USERNAME }}'
          reason="Pre-release: PR approved, tagged with pre-release tag."

          if [[ '${{ github.event_name }}' == "workflow_dispatch" ]]; then
              # For UI manually triggered runs (workflow_dispatch event), use the arg. values from env: vars, secrets, defaults
              # and override with the inputs from the UI:

              minver_prerelease_id='${{ inputs.minver-prerelease-id }}'
              reason='${{ inputs.reason }}'
          fi

          dump_vars \
              --force \
              --quiet \
              --markdown \
              --header "Job get-params outputs:" \
              package_projects \
              preprocessor_symbols \
              minver_tag_prefix \
              minver_prerelease_id \
              reason \
              nuget_server \
              nuget_username | to_summary

          # Set the outputs:
          args_to_github_output \
              package_projects \
              preprocessor_symbols \
              minver_tag_prefix \
              minver_prerelease_id \
              reason \
              nuget_server \
              nuget_username

      # NuGet.org trusted publishing keys the OIDC trust policy off job_workflow_ref, which for a reusable workflow
      # names the workflow FILE that is running, not the repository that called it -- _prerelease.yaml (in
      # vm2.DevOps) can never satisfy a trust policy scoped to THIS repository, so the exchange has to happen here,
      # in the job whose job_workflow_ref actually matches the policy. The resulting short-lived key is handed to
      # _prerelease.yaml as a secret below instead.
      - name: Authenticate with NuGet.org trusted publishing
        if: steps.gather-params.outputs.nuget-server == 'nuget'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ steps.gather-params.outputs.nuget-username }}

  log-trigger:
    name: Log manual trigger reason
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log manual trigger reason
        run: |
          echo "::notice::Manual release triggered by ${{ github.actor }}"
          echo "::notice::Reason: ${{ inputs.reason }}"

  build-prerelease:
    name: Prerelease - package and release NuGet prerelease packages
    needs:
      - get-params
    uses: vmelamed/vm2.DevOps/.github/workflows/_prerelease.yaml@big-bang
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }} # Required PAT for pushing changelog and tags past branch protection.
      # For 'nuget' (NuGet.org), this is the short-lived key get-params already obtained via its own OIDC trusted-
      # publishing exchange (job_workflow_ref there matches this repo's trust policy). For 'github'/a custom URL,
      # it falls back to this repo's own static secret.
      NUGET_API_KEY: ${{ needs.get-params.outputs.nuget-api-key || secrets.NUGET_API_KEY }}
    permissions:
      actions: read # Required to checkout the code, push changelog, and create tags
      contents: write # Required to checkout the code, push changelog, and create tags
      packages: write # Required to add pre-release NuGet packages
    with:
      package-projects: ${{ needs.get-params.outputs.package-projects }}
      preprocessor-symbols: ${{ needs.get-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ needs.get-params.outputs.minver-tag-prefix }}
      minver-prerelease-id: ${{ needs.get-params.outputs.minver-prerelease-id }}
      reason: ${{ needs.get-params.outputs.reason }}
      nuget-server: ${{ needs.get-params.outputs.nuget-server }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  remind-changelog:
    name: Reminder - review CHANGELOG.md
    runs-on: ubuntu-latest
    needs:
      - build-prerelease
    steps:
      - name: Post reminder
        shell: bash
        run: |
          echo "::notice::Pre-release completed. Now is a good time to review/edit CHANGELOG.md before stable release. CHANGELOG.md only - do not mix-in other files."
          {
            echo "## CHANGELOG Reminder"
            echo
            echo "> [!IMPORTANT]"
            echo "> Pre-release completed. Now is a good time to review/edit CHANGELOG.md before stable release."
            echo "> CHANGELOG.md only - do not mix-in other files."
            echo
            echo "Recommended: keep changelog updates in a dedicated commit or PR before the release workflow."
          } >> "$GITHUB_STEP_SUMMARY"
