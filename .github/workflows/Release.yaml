name: Publish Release NuGet Package

# This workflow handles the publishing of NuGet stable releases. It is only **triggered manually** via the workflow_dispatch
# event from the **main branch**.

on:
  # we release from main only, on manual trigger only
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual release (do not use: ; | & $ ` \\ < > ( ) { } new-line )"
        required: true
        type: string

env:
  PACKAGE_PROJECTS: >-
    [
    "src/Ulid/Ulid.csproj",
    "src/Serialization.NsJson.Ulid/Serialization.NsJson.Ulid.csproj",
    "src/UlidTool/UlidTool.csproj"
    ]
  NUGET_SERVER: ${{ vars.NUGET_SERVER || 'nuget' }}
  NUGET_USERNAME: ${{ vars.NUGET_USERNAME || 'vmelamed' }}
  PREPROCESSOR_SYMBOLS: ""
  MINVERTAGPREFIX: ${{ vars.MINVERTAGPREFIX || 'v' }}                           # The MinVer tag prefix.
  VERBOSE: ${{ vars.VERBOSE || false }}                                         # Set the variable to "true" to enable verbose logging in scripts.
  REASON: ${{ inputs.reason }}

jobs:
  get-params:
    name: Prepare the parameters
    runs-on: ubuntu-latest
    # Only allow manual releases from the main branch, as a safety measure against accidental releases from PRs or other branches.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    outputs:
      package-projects: ${{ steps.gather-params.outputs.package-projects }}
      preprocessor-symbols: ${{ steps.gather-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ steps.gather-params.outputs.minver-tag-prefix }}
      reason: ${{ steps.gather-params.outputs.reason }}
      nuget-server: ${{ steps.gather-params.outputs.nuget-server }}
      nuget-username: ${{ steps.gather-params.outputs.nuget-username }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Setup the latest jq
        id: setup-jq
        uses: vmelamed/vm2.DevOps/.github/actions/setup-jq@main

      - name: Gather argument values depending on the event
        id: gather-params
        shell: bash
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          package_projects=$PACKAGE_PROJECTS
          validate_json_array package_projects '[]' is_safe_existing_file

          preprocessor_symbols=$PREPROCESSOR_SYMBOLS
          minver_tag_prefix=$MINVERTAGPREFIX
          nuget_server=$NUGET_SERVER
          nuget_username=$NUGET_USERNAME

          # Release is always activated manually from the GitHub Actions UI:
          reason=$REASON

          gh_reason=$(gh_escape "$reason")
          declare -a args=(
              --force
              --quiet
              --markdown
              --header "Job get-params outputs:"
              package_projects
              preprocessor_symbols
              minver_tag_prefix
              gh_reason
              nuget_server
              nuget_username
          )
          dump_vars "${args[@]}" | to_summary

          # Set the outputs:
          args=(
              package_projects
              preprocessor_symbols
              minver_tag_prefix
              reason
              nuget_server
              nuget_username
          )
          args_to_github_output "${args[@]}"

  log-trigger:
    name: Log manual trigger reason
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Log manual trigger reason
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          gh_reason=$(gh_escape "$REASON")

          printf '::notice::Manual release triggered by %s. Reason: %s\n' '${{ github.actor }}' "$gh_reason"
          printf '## Manual trigger\n\n**By:** %s\n**Reason:** %s\n' '${{ github.actor }}' "$gh_reason" | to_stdout

  build-release:
    name: Release - package and publish NuGet stable release packages
    needs:
      - get-params
    uses: vmelamed/vm2.DevOps/.github/workflows/_release.yaml@main
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }} # Required PAT for pushing changelog and tags past branch protection.
    permissions:
      actions: read # Required to checkout the code, push changelog, and create tags
      contents: write # Required to checkout the code, push changelog, and create tags
      packages: write # Required to add stable NuGet packages
    with:
      package-projects: ${{ needs.get-params.outputs.package-projects }}
      preprocessor-symbols: ${{ needs.get-params.outputs.preprocessor-symbols }}
      minver-tag-prefix: ${{ needs.get-params.outputs.minver-tag-prefix }}
      reason: ${{ needs.get-params.outputs.reason }}

  publish-release:
    name: Publish NuGet release packages
    needs:
      - get-params
      - build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read   # Required to read workflow run artifact IDs (for downloading package artifacts if the NuGet server is 'nuget')
      id-token: write # Required for authentication with the NuGet server
    steps:
      - name: Download package artifact
        # This job never builds anything -- it only downloads .nupkg files another job already produced and pushes
        # them -- so "packages" here is just a local staging directory for this job's own runner, not the
        # Directory.Build.props-derived ArtifactsPath the rest of the pipeline uses for real build output.
        #
        # merge-multiple: true flattens all downloaded package artifacts into one directory -- without it, each
        # artifact-id lands in its own nested subfolder (packages/<artifact-name>/*.nupkg), one level deeper than
        # the flat packages/*.nupkg glob the publish step below expects.
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact-ids }}
          path: packages
          merge-multiple: true

      - name: Setup DevOps environment variables
        id: setup-env
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Authenticate with NuGet.org trusted publishing to get steps.nuget-login.outputs.NUGET_API_KEY
        if: needs.get-params.outputs.nuget-server == 'nuget'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ needs.get-params.outputs.nuget-username }}

      - name: Publish NuGet release packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ needs.get-params.outputs.nuget-server != 'nuget' && secrets.NUGET_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SERVER: ${{ needs.get-params.outputs.nuget-server }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          set -euo pipefail

          declare -xri err_missing_argument
          declare -xri err_argument_value

          artifacts_dir="packages"
          server_name=$NUGET_SERVER
          server_url=""

          case "$NUGET_SERVER" in
              nuget )
                  server_name="NuGet.org"
                  server_url="https://api.nuget.org/v3/index.json"
                  ;;

              github )
                  server_name="GitHub Packages"
                  server_url="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                  ;;

              http://*|https://* )
                  server_name=$NUGET_SERVER
                  server_url=$NUGET_SERVER
                  ;;

              * )
                  error -ec "$err_argument_value" -ns "Unsupported NuGet server: $NUGET_SERVER. Supported values: 'nuget', 'github', 'custom URL'."
                  ;;
          esac

          [[ -n "$NUGET_API_KEY" ]] || exit_with_error -ec "$err_missing_argument" -ns "No API key provided for server '$server_name'"

          for pkg in "$artifacts_dir"/*.nupkg; do
              trace "Publishing package: $pkg"
              dotnet nuget push "$pkg" \
                  --source "$server_url" \
                  --api-key "$NUGET_API_KEY" \
                  --skip-duplicate
          done
